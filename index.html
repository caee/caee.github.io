<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Carl Emil Elling</title>
  <meta name="description" content="Resume and projects of Carl Emil Elling." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cabin:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <!-- Everything below is filled in from content.js by assets/js/site.js -->
  <div class="page">
    <header class="masthead">
      <img class="photo" id="photo" alt="" />
      <div class="masthead-text">
        <h1 id="name"></h1>
        <p class="subtitle" id="title"></p>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <nav id="nav" class="nav" aria-label="Sections"></nav>
        <div class="sidebar-foot" id="sidebar-foot"></div>
      </aside>
      <main id="main" class="main" tabindex="-1"></main>
    </div>
  </div>

  <div id="lightbox" class="lightbox" hidden>
    <button class="lightbox-close" aria-label="Close">&times;</button>
    <img alt="" />
  </div>

  <script src="content.js"></script>
  <script src="assets/js/site.js"></script>
</body>
</html>
